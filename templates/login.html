<!DOCTYPE html>
<html>
<head>
    <title>DFarming Login</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f5f5f5;
        }

        .header{
            background:#2e7d32;
            color:white;
            padding:15px;
            text-align:center;
            font-size:24px;
            font-weight:bold;
        }

        .navbar{
            background:#ffffff;
            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        .navbar a{
            text-decoration:none;
            margin:20px;
            color:#2e7d32;
            font-weight:bold;
        }

        .navbar a:hover{
            color:#1b5e20;
        }

        .login-container{
            display:flex;
            justify-content:center;
            align-items:center;
            height:70vh;
        }

        .login-box{
            background:white;
            width:350px;
            padding:30px;
            border-radius:10px;
            text-align:center;
            box-shadow:0px 0px 15px rgba(0,0,0,0.2);
        }

        .login-box h1{
            color:#2e7d32;
            margin-bottom:20px;
        }

        .login-box input{
            width:90%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .login-box button{
            width:100%;
            padding:12px;
            background:#2e7d32;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        .login-box button:hover{
            background:#1b5e20;
        }

        .whatsapp{
            position:fixed;
            bottom:20px;
            right:20px;
            background:#25D366;
            color:white;
            font-size:30px;
            padding:15px;
            border-radius:50%;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="header">
    🌳 D Farming - Tree Plantation & Plant Booking
</div>

<div class="navbar">
    <a href="/">Home</a>
    <a href="/register">Register</a>
    <a href="/login">Login</a>
    <a href="/addplant">Add Plant</a>
    <a href="/contact">Contact Us</a>
    <a href="https://wa.me/919999999999">WhatsApp</a>
</div>

<div class="login-container">
    <div class="login-box">
        <h1>D Farming Login</h1>

        <form>
            <input type="email" placeholder="Enter Email" required>

            <input type="password" placeholder="Enter Password" required>

            <button type="submit">Login</button>
        </form>
    </div>
</div>

<a href="https://wa.me/919999999999" class="whatsapp">
    💬
</a>

</body>
</html>
